<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - ระบบจัดการแข่งขันกรีฑา</title>
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- กล่อง Register -->
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">สมัครสมาชิก</h2>
        
        <form>
            <!-- ช่องกรอกอีเมล -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">อีเมล</label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-green-500" type="email" id="email" placeholder="example@email.com">
            </div>
            
            <!-- ช่องกรอกรหัสผ่าน -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">รหัสผ่าน</label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-green-500" type="password" id="password" placeholder="********">
            </div>

            <!-- ช่องยืนยันรหัสผ่าน -->
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm-password">ยืนยันรหัสผ่าน</label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-green-500" type="password" id="confirm-password" placeholder="********">
            </div>
            
            <!-- ปุ่มลงทะเบียน เปลี่ยนเป็นสีเขียวให้ต่างจาก Login -->
            <button class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button">
                ลงทะเบียนบัญชีใหม่
            </button>
        </form>

        <!-- ลิงก์กลับไปหน้า Login -->
        <p class="mt-4 text-center text-sm text-gray-600">
            มีบัญชีอยู่แล้ว? <a href="login.html" class="text-blue-600 hover:underline">เข้าสู่ระบบที่นี่</a>
        </p>
    </div>

</body>
</html>
