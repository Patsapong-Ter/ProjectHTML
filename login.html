<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการแข่งขันกรีฑา</title>
    <!-- เรียกใช้ Tailwind CSS ผ่าน CDN เพื่อความรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ตั้งค่า Font ภาษาไทยให้สวยงาม (ใช้ Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- กล่อง Login -->
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">เข้าสู่ระบบ</h2>
        
        <form>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">อีเมล</label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500" type="email" id="email" placeholder="example@email.com">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">รหัสผ่าน</label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500" type="password" id="password" placeholder="********">
            </div>
            
            <a href="events.html" class="block text-center w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
    เข้าสู่ระบบ
</a>
            <p class="mt-4 text-center text-sm text-gray-600">
                ยังไม่มีบัญชี? <a href="register.html" class="text-blue-600 hover:underline">สมัครสมาชิกเลย</a>
            </p>
        </form>
    </div>

</body>
</html>
